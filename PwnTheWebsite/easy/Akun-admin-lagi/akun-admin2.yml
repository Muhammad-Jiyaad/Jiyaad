services:
  web:
    image: ghcr.io/hengkerrusia/auth2:latest
    ports:
      - "1337:3000"
    environment:
      - PWN=${PWN:-testuser}
    
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
